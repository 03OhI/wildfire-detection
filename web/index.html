<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AHE-YOLO11 산불 탐지 시스템</title>
    <style>
        :root { --bg: #101827; --panel: #1f2937; --accent: #3b82f6; --text: #e5e7eb; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 1000px; background: var(--panel); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #374151; }
        header { padding: 20px; border-bottom: 1px solid #374151; }
        .main { display: flex; padding: 20px; gap: 20px; }
        .sidebar { width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .upload-box { border: 2px dashed #374151; padding: 30px; text-align: center; cursor: pointer; border-radius: 8px; }
        .viewer { flex: 1; background: #000; position: relative; border-radius: 8px; min-height: 450px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .slider-group { margin-top: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .analyze-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .analyze-btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 AHE-YOLO11 산불 탐지 시스템 (vs_function)</h1>
        </header>
        <div class="main">
            <aside class="sidebar">
                <div class="upload-box" id="dropZone">
                    <p>📁 영상 업로드 (클릭)</p>
                    <input type="file" id="videoInput" accept="video/*" style="display:none;">
                </div>
                <div class="parameters">
                    <div class="slider-group">
                        <label>Confidence: <span id="confVal">0.25</span></label>
                        <input type="range" id="confSlider" min="0.01" max="1" step="0.01" value="0.25">
                    </div>
                    <div class="slider-group">
                        <label>IoU (NMS): <span id="iouVal">0.45</span></label>
                        <input type="range" id="iouSlider" min="0.01" max="1" step="0.01" value="0.45">
                    </div>
                </div>
                <button class="analyze-btn" id="startBtn">▶ 분석 시작</button>
            </aside>
            <section class="viewer">
                <video id="mainVideo" loop muted playsinline></video>
                <canvas id="resultCanvas"></canvas>
            </section>
        </div>
    </div>
    <script src="js_web.js"></script>
</body>
</html>
